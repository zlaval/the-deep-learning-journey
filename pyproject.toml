[project]
name = "deeplearning"
version = "0.1.0"
description = "DeepL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.21.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
